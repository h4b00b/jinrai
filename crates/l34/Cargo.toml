[package]
name = "jinrai-l34"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
description = "L3/L4 traffic generation (UDP/TCP connect/TCP SYN). Isolated-lab use only."

[dependencies]
jinrai-core   = { workspace = true }
jinrai-safety = { workspace = true }
# Raw socket for the SYN primitive (safe API — no unsafe needed here).
# `all` feature exposes Type::RAW.
socket2 = { version = "0.5", features = ["all"] }
# Pure-Rust IPv4/TCP header + checksum construction for the SYN packet.
etherparse = "0.16"
# Latency percentiles for the TCP handshake (connect-initiation -> resolution).
# Same crate/version the L7 engine already uses, so this adds no new supply chain;
# a bounded histogram also keeps a long soak run's memory flat, unlike keeping
# every sample.
hdrhistogram = "7"

[lints.rust]
unsafe_code = "forbid"

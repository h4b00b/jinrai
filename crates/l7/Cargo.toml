[package]
name = "jinrai-l7"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
description = "L7 HTTP/API constant-rate load generation."

[dependencies]
jinrai-core   = { workspace = true }
jinrai-safety = { workspace = true }

# Async runtime — the L7 engine builds its own multi-thread runtime inside
# execute() so core stays runtime-agnostic.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
# HTTP client. rustls (no OpenSSL/system TLS), trimmed default features, one
# shared Client for connection pooling. `resolve_to_addrs` is used to pin the
# host to the gate-authorized IP(s).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
# Latency percentiles.
hdrhistogram = "7"
# Async TLS for the slow-connection + HTTP/2 engines. rustls only (no OpenSSL /
# system TLS), `ring` provider pinned to match the rustls/tokio-rustls versions
# reqwest already pulls in, so no second TLS stack is added to the tree.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# HTTP/2 client for the rapid-reset primitive (open stream, immediate RST_STREAM).
# Already in the tree via reqwest/hyper; pinned to the same majors so no dup.
h2 = "0.4"
http = "1"
# Socket-option control for slow-read (shrink SO_RCVBUF so the server cannot
# flush its response). Already in the workspace tree via `l34`. SockRef borrows a
# connected tokio stream — no unsafe, no second socket.
socket2 = "0.5"
# QUIC / HTTP-3. The one primitive family that cannot be hand-rolled the way the
# raw h2 and TLS-hello framing was: QUIC carries its handshake inside AEAD-
# protected packets, so reaching the server's crypto work at all means
# implementing header protection, packet number spaces and loss recovery first.
#
# The supply-chain cost is far smaller than it looks: `reqwest` already declares
# quinn behind its (unused) `http3` feature, so these exact versions are already
# resolved in `Cargo.lock` and reviewed as part of this tree. quinn drives the
# same `rustls` 0.23 + `ring` provider the rest of the crate uses — no second TLS
# stack, no second crypto backend. Default features are off so neither `log` nor
# `platform-verifier` (a whole OS trust-store stack, useless to an engine that
# accepts any certificate by design) comes with it.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }

[dev-dependencies]
# Self-signed certificate for the in-test QUIC listener. Test-only — it never
# reaches the shipped binary. The QUIC primitives cannot be verified the way the
# raw h2 and TLS-hello framing was (write the bytes, read them back with a
# generic tool): nothing sees a QUIC stream without completing a handshake first,
# so checking that jinrai's HTTP/3 bytes actually arrive means standing up a real
# QUIC server, and that means a certificate.
rcgen = "0.13"

[lints.rust]
unsafe_code = "forbid"
